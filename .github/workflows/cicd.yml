name: CI/CD Pipeline

# main 브랜치에 push 시 실행
on:
  push:
    branches:
      - main

# 연속 push 시 이전 실행 취소
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout repository # 저장소 체크아웃
      uses: actions/checkout@v4

    - name: Set up PHP # PHP 8.3 및 확장 모듈 설치
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.3'
        extensions: mbstring, pdo_sqlite, sqlite3, bcmath, exif, pcntl
        coverage: none

    - name: Install Composer dependencies # composer 의존성 설치
      run: composer install --no-interaction --prefer-dist

    - name: Prepare environment file # .env 준비 및 APP_KEY 생성
      run: |
        cp .env.example .env
        php artisan key:generate

    - name: Create fake Vite manifest # 뷰 렌더링 테스트용 최소 manifest (실제 프론트엔드 빌드는 build 잡의 Docker 이미지 안에서 한 번만 수행)
      run: |
        mkdir -p public/build
        cat > public/build/manifest.json << 'EOF'
        {
          "resources/css/app.css": { "file": "assets/app.css", "src": "resources/css/app.css", "isEntry": true }
        }
        EOF

    - name: Run tests # phpunit 테스트 실행 (SQLite 인메모리 DB 사용)
      run: composer test
      env:
        DB_CONNECTION: sqlite
        DB_DATABASE: ":memory:"

  build:
    runs-on: ubuntu-22.04
    needs: test # 테스트 통과 후 빌드

    steps:
    - name: Checkout repository # 저장소 체크아웃
      uses: actions/checkout@v4

    - name: Set up Docker Buildx # Docker Buildx 설정
      uses: docker/setup-buildx-action@v3

    - name: Login to DockerHub # DockerHub 로그인
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and push # 이미지 빌드 및 push (GitHub Actions 캐시로 레이어 재사용)
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: |
          ${{ secrets.DOCKER_USERNAME }}/${{ secrets.PROJECT_NAME }}:${{ github.sha }}
          ${{ secrets.DOCKER_USERNAME }}/${{ secrets.PROJECT_NAME }}:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-22.04
    needs: build # build 완료 후 실행

    steps:
    - name: Deploy to server # 서버에 SSH 접속하여 배포
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SERVER_IP }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: 22
        script: |
          set -e

          # 최신 이미지 pull
          docker pull ${{ secrets.DOCKER_USERNAME }}/${{ secrets.PROJECT_NAME }}:latest

          # 기존 컨테이너 중지 및 삭제 (없으면 무시)
          docker stop ${{ secrets.PROJECT_NAME }} || true
          docker rm ${{ secrets.PROJECT_NAME }} || true

          # 새 컨테이너 실행 (.env 주입, NPM과 같은 네트워크 연결, 재부팅 시 자동 시작)
          docker run -d \
            --name ${{ secrets.PROJECT_NAME }} \
            --restart unless-stopped \
            -v ${{ secrets.ENV_PATH }}:/var/www/html/.env \
            -v ${{ secrets.LOG_DIR_PATH }}:/var/www/html/storage/logs \
            -v ${{ secrets.UPLOADS_DIR_PATH }}:/var/www/html/storage/app/public \
            --network ${{ secrets.NETWORK_NAME }} \
            ${{ secrets.DOCKER_USERNAME }}/${{ secrets.PROJECT_NAME }}:latest

          # public 디스크 심볼릭 링크 생성 (컨테이너 재생성 시마다 다시 필요)
          docker exec ${{ secrets.PROJECT_NAME }} php artisan storage:link

          # DB 마이그레이션 실행
          docker exec ${{ secrets.PROJECT_NAME }} php artisan migrate --force

          # 설정/라우트/뷰 캐시 갱신
          docker exec ${{ secrets.PROJECT_NAME }} php artisan config:cache
          docker exec ${{ secrets.PROJECT_NAME }} php artisan route:cache
          docker exec ${{ secrets.PROJECT_NAME }} php artisan view:cache
